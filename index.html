<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Form</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', sans-serif; background: #f5f5f5; min-height: 100vh; }
    .header { background: #06c755; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; }
    .container { padding: 16px; max-width: 480px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
    select, input { width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 15px; background: white; appearance: none; -webkit-appearance: none; }
    select:focus, input:focus { outline: none; border-color: #06c755; }
    .btn { width: 100%; padding: 14px; background: #06c755; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn-cancel { background: #f5f5f5; color: #666; margin-top: 8px; }
    .hidden { display: none; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .success { text-align: center; padding: 40px; }
    .success .icon { font-size: 60px; margin-bottom: 16px; }
    .success h2 { color: #06c755; margin-bottom: 8px; }
    .success p { color: #666; font-size: 14px; line-height: 1.6; }
    .action-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 500; cursor: pointer; color: #666; background: white; }
    .tab.active { border-color: #06c755; color: #06c755; background: #f0fff4; }
    .section-title { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="header">📦 บันทึกสต็อก</div>

<div id="loading" class="loading">กำลังโหลด...</div>

<div id="form-container" class="container hidden">
  <div class="card">
    <div class="section-title">รายการ</div>
    <div class="action-tabs">
      <div class="tab active" data-action="IN" onclick="selectAction('IN')">📥 นำเข้า</div>
      <div class="tab" data-action="OUT" onclick="selectAction('OUT')">📤 นำออก</div>
      <div class="tab" data-action="COUNT" onclick="selectAction('COUNT')">🔢 นับสต็อก</div>
      <div class="tab" data-action="MOVE" onclick="selectAction('MOVE')">🔄 โอนย้าย</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">สถานที่</div>
    <div class="field">
      <label>สถานที่ต้นทาง</label>
      <select id="location" onchange="onLocationChange()">
        <option value="">-- เลือกสถานที่ --</option>
      </select>
    </div>
    <div class="field hidden" id="destination-field">
      <label>สถานที่ปลายทาง</label>
      <select id="destination">
        <option value="">-- เลือกปลายทาง --</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="section-title">สินค้า</div>
    <div class="field">
      <label>ประเภทสินค้า</label>
      <select id="family" onchange="onFamilyChange()">
        <option value="">-- เลือกประเภท --</option>
      </select>
    </div>
    <div class="field">
      <label>สินค้า</label>
      <select id="item" onchange="onItemChange()">
        <option value="">-- เลือกสินค้า --</option>
      </select>
    </div>
    <div class="field hidden" id="variation-field">
      <label>ขนาด</label>
      <select id="variation" onchange="onVariationChange()">
        <option value="">-- เลือกขนาด --</option>
      </select>
    </div>
    <div class="field hidden" id="out-target-field">
      <label>ผลิตเป็น</label>
      <select id="out-target">
        <option value="">-- เลือกขนาดที่ผลิต --</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="section-title">จำนวน</div>
    <div class="field">
      <label id="qty-label">จำนวน</label>
      <input type="number" id="qty" placeholder="0" min="0" step="0.01" inputmode="decimal">
    </div>
    <div class="field hidden" id="reason-field">
      <label>เหตุผลที่นำออก</label>
      <select id="reason" onchange="onReasonChange()">
        <option value="">-- เลือกเหตุผล --</option>
      </select>
    </div>
    <div class="field hidden" id="reason-text-field">
      <label>ระบุเหตุผล</label>
      <input type="text" id="reason-text" placeholder="กรุณาพิมพ์เหตุผล">
    </div>
  </div>

  <button class="btn" onclick="submitForm()" id="submit-btn">✅ บันทึก</button>
  <button class="btn btn-cancel" onclick="liff.closeWindow()">ยกเลิก</button>
</div>

<div id="success" class="container hidden">
  <div class="card success">
    <div class="icon">✅</div>
    <h2>บันทึกแล้ว!</h2>
    <p id="success-detail"></p>
    <button class="btn" style="margin-top:24px" onclick="resetForm()">บันทึกรายการใหม่</button>
    <button class="btn btn-cancel" onclick="liff.closeWindow()">ปิด</button>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpTW6297O_iP8bIWxu_8KSzUE2MnHeU_CwDSEBOvZbbemH7sk4NKDAtJCY_GkuzITi/exec';
const LIFF_ID = '2010076946-hXx9D9XU'; // new LIFF ID

let userData = null;
let configData = null;
let currentAction = 'IN';
let currentUserId = null;

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });

    // If not logged in (e.g. PC external browser), trigger LINE login
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    // Get user profile
    const profile = await liff.getProfile();
    currentUserId = profile.userId;

    // Get action from URL param
    const params = new URLSearchParams(window.location.search);
    const action = params.get('action') || 'IN';

    // Load data from Apps Script
    const response = await fetch(`${APPS_SCRIPT_URL}?action=getFormData&userId=${currentUserId}`);
    const data = await response.json();

    if (!data.success) {
      alert('⚠️ คุณยังไม่ได้ลงทะเบียน กรุณาติดต่อผู้จัดการ\n\nรหัสของคุณ:\n' + currentUserId);
      liff.closeWindow();
      return;
    }

    userData = data.user;
    configData = data;

    // Populate dropdowns
    populateLocations();
    populateReasons();
    populateFamilies();

    // Set initial action
    selectAction(action);

    // Show form
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('form-container').classList.remove('hidden');

  } catch (err) {
    document.getElementById('loading').textContent = 'เกิดข้อผิดพลาด: ' + err.message;
  }
}

function selectAction(action) {
  currentAction = action;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-action="${action}"]`).classList.add('active');

  // Show/hide destination for MOVE
  document.getElementById('destination-field').classList.toggle('hidden', action !== 'MOVE');

  // Show/hide reason for OUT
  document.getElementById('reason-field').classList.toggle('hidden', action !== 'OUT');

  // Reset item selections
  onFamilyChange();
  updateQtyLabel();
}

function populateLocations() {
  const sel = document.getElementById('location');
  const destSel = document.getElementById('destination');
  sel.innerHTML = '<option value="">-- เลือกสถานที่ --</option>';
  destSel.innerHTML = '<option value="">-- เลือกปลายทาง --</option>';

  userData.locations.forEach(l => {
    sel.innerHTML += `<option value="${l}">${l}</option>`;
    destSel.innerHTML += `<option value="${l}">${l}</option>`;
  });

  // Auto-select if only one location
  if (userData.locations.length === 1) {
    sel.value = userData.locations[0];
  }
}

function populateFamilies() {
  const sel = document.getElementById('family');
  sel.innerHTML = '<option value="">-- เลือกประเภท --</option>';
  configData.families.forEach(f => {
    sel.innerHTML += `<option value="${f}">${f}</option>`;
  });
  if (configData.families.length === 1) {
    sel.value = configData.families[0];
    onFamilyChange();
  }
}

function populateReasons() {
  const sel = document.getElementById('reason');
  sel.innerHTML = '<option value="">-- เลือกเหตุผล --</option>';
  configData.reasons.forEach(r => {
    sel.innerHTML += `<option value="${r.reasonId}" data-free="${r.allowFreeText}">${r.label}</option>`;
  });
}

function onLocationChange() {
  const loc = document.getElementById('location').value;
  const destSel = document.getElementById('destination');
  destSel.innerHTML = '<option value="">-- เลือกปลายทาง --</option>';
  userData.locations.filter(l => l !== loc).forEach(l => {
    destSel.innerHTML += `<option value="${l}">${l}</option>`;
  });
}

function onFamilyChange() {
  const family = document.getElementById('family').value;
  const itemSel = document.getElementById('item');
  itemSel.innerHTML = '<option value="">-- เลือกสินค้า --</option>';

  if (!family) return;

  const items = configData.items.filter(i => i.family === family);
  items.forEach(i => {
    itemSel.innerHTML += `<option value="${i.itemId}">${i.itemName}</option>`;
  });

  if (items.length === 1) {
    itemSel.value = items[0].itemId;
    onItemChange();
  } else {
    document.getElementById('variation-field').classList.add('hidden');
    document.getElementById('out-target-field').classList.add('hidden');
  }
}

function onItemChange() {
  const itemId = document.getElementById('item').value;
  const item = configData.items.find(i => i.itemId === itemId);

  document.getElementById('variation-field').classList.add('hidden');
  document.getElementById('out-target-field').classList.add('hidden');

  if (!item) return;

  if (item.variations && item.variations.length > 0) {
    const varSel = document.getElementById('variation');
    varSel.innerHTML = '<option value="">-- เลือกขนาด --</option>';
    item.variations.forEach(v => {
      varSel.innerHTML += `<option value="${v}">${v}</option>`;
    });
    document.getElementById('variation-field').classList.remove('hidden');

    if (item.variations.length === 1) {
      varSel.value = item.variations[0];
      onVariationChange();
    }
  } else {
    onVariationChange();
  }

  updateQtyLabel(item);
}

function onVariationChange() {
  const itemId = document.getElementById('item').value;
  const item = configData.items.find(i => i.itemId === itemId);

  document.getElementById('out-target-field').classList.add('hidden');

  if (!item || !item.rule) return;

  if (currentAction === 'OUT' && item.rule.ruleType === 'OUT_TARGET') {
    const targetItem = configData.items.find(i => i.itemId === item.rule.value);
    if (targetItem) {
      const sel = document.getElementById('out-target');
      sel.innerHTML = '<option value="">-- เลือกขนาดที่ผลิต --</option>';
      targetItem.variations.forEach(v => {
        sel.innerHTML += `<option value="${v}">${v}</option>`;
      });
      document.getElementById('out-target-field').classList.remove('hidden');
      document.getElementById('reason-field').classList.add('hidden');
    }
  }
}

function onReasonChange() {
  const sel = document.getElementById('reason');
  const selected = sel.options[sel.selectedIndex];
  const allowFreeText = selected && selected.dataset.free === 'true';
  document.getElementById('reason-text-field').classList.toggle('hidden', !allowFreeText);
}

function updateQtyLabel(item) {
  if (!item) {
    item = configData ? configData.items.find(i => i.itemId === document.getElementById('item').value) : null;
  }
  const unit = item ? item.unit : '';
  document.getElementById('qty-label').textContent = `จำนวน${unit ? ' (' + unit + ')' : ''}`;
}

async function submitForm() {
  const action = currentAction;
  const location = document.getElementById('location').value;
  const family = document.getElementById('family').value;
  const itemId = document.getElementById('item').value;
  const variation = document.getElementById('variation').value || '';
  const outTarget = document.getElementById('out-target').value || '';
  const destination = document.getElementById('destination').value || '';
  const qty = parseFloat(document.getElementById('qty').value);
  const reasonSel = document.getElementById('reason');
  const reasonLabel = reasonSel.options[reasonSel.selectedIndex]?.text || '';
  const reasonText = document.getElementById('reason-text').value || '';
  const finalReason = reasonText || reasonLabel;

  const item = configData.items.find(i => i.itemId === itemId);

  // Validation
  if (!location) return alert('กรุณาเลือกสถานที่');
  if (!family) return alert('กรุณาเลือกประเภทสินค้า');
  if (!itemId) return alert('กรุณาเลือกสินค้า');
  if (item?.variations?.length > 0 && !variation) return alert('กรุณาเลือกขนาด');
  if (action === 'MOVE' && !destination) return alert('กรุณาเลือกสถานที่ปลายทาง');
  if (action === 'MOVE' && destination === location) return alert('สถานที่ต้นทางและปลายทางต้องไม่เหมือนกัน');
  if (isNaN(qty) || qty <= 0) return alert('กรุณาระบุจำนวนที่ถูกต้อง');
  if (action === 'OUT' && !outTarget && !finalReason && !item?.rule) return alert('กรุณาเลือกเหตุผล');

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  try {
    const payload = {
      action: 'submitStock',
      userId: currentUserId,
      stockAction: action,
      location,
      family,
      itemId,
      itemName: item?.itemName || '',
      variation,
      outTarget,
      destination,
      qty,
      unit: item?.unit || '',
      reason: finalReason,
      hasOutTargetRule: !!(item?.rule?.ruleType === 'OUT_TARGET' && outTarget)
    };

    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.success) {
      document.getElementById('form-container').classList.add('hidden');
      document.getElementById('success').classList.remove('hidden');

      let detail = `รายการ: ${action}\nสินค้า: ${family} ${item?.itemName} ${variation}\nจำนวน: ${qty} ${item?.unit}\nสถานที่: ${location}`;
      if (destination) detail += ` → ${destination}`;
      if (finalReason) detail += `\nเหตุผล: ${finalReason}`;

      document.getElementById('success-detail').textContent = detail;
    } else {
      alert('เกิดข้อผิดพลาด: ' + result.error);
      btn.disabled = false;
      btn.textContent = '✅ บันทึก';
    }
  } catch (err) {
    alert('เกิดข้อผิดพลาด: ' + err.message);
    btn.disabled = false;
    btn.textContent = '✅ บันทึก';
  }
}

function resetForm() {
  document.getElementById('form-container').classList.remove('hidden');
  document.getElementById('success').classList.add('hidden');
  document.getElementById('qty').value = '';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = '✅ บันทึก';
}

init();
</script>
</body>
</html>
